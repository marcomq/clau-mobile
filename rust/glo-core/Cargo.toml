[package]
name = "glo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "glo_firmware"

[dependencies]
cpal = "0.18.2"
rtrb = "0.4.0"

[build-dependencies]
cc = "1.8.0"

[target.'cfg(target_os = "android")'.dependencies]
# AAudio LowLatency performance mode; without it Android uses the slow mixer path with large bursts.
cpal = { version = "0.18.2", features = ["realtime"] }
jni-sys = "0.4.1"
libc = "0.2"
ndk-context = "0.1.1"
